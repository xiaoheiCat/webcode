name: Build WASM Terminals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  C2W_VERSION: v0.8.4

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build matrix
        id: set-matrix
        run: echo "matrix=$(bash scripts/build-dist.sh matrix)" >> "$GITHUB_OUTPUT"

  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Restore build deps cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: webcode-deps-${{ env.C2W_VERSION }}-${{ hashFiles('web/shim/Dockerfile', 'web/shim/**') }}
          restore-keys: |
            webcode-deps-${{ env.C2W_VERSION }}-

      - name: Build shared deps
        env:
          DOCKER_BUILDKIT: 1
        run: bash scripts/build-dist.sh deps

  build:
    needs: [prepare, deps]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Restore build deps cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: webcode-deps-${{ env.C2W_VERSION }}-${{ hashFiles('web/shim/Dockerfile', 'web/shim/**') }}
          restore-keys: |
            webcode-deps-${{ env.C2W_VERSION }}-

      - name: Build product
        env:
          DOCKER_BUILDKIT: 1
        run: |
          bash scripts/build-dist.sh product \
            "${{ matrix.id }}" \
            "${{ matrix.container }}" \
            "${{ matrix.title }}"

      - name: Upload product
        uses: actions/upload-artifact@v4
        with:
          name: product-${{ matrix.id }}
          path: dist/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download products
        uses: actions/download-artifact@v4
        with:
          pattern: product-*
          path: _artifacts

      - name: Merge dist
        run: |
          mkdir -p dist
          for dir in _artifacts/product-*; do
            id="$(basename "$dir" | sed 's/^product-//')"
            mv "$dir" "dist/$id"
          done
          bash scripts/build-dist.sh merge

      - name: Package release zips
        run: bash scripts/build-dist.sh release-zips release

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_id }}"
          gh release create "$tag" \
            --title "WebCode build ${tag}" \
            --notes "Automated build from workflow run ${{ github.run_id }} (${{ github.sha }}). Download all webcode-*.zip assets, extract them into the same folder, and host that folder as static files. See README.md for details." \
            release/*.zip
